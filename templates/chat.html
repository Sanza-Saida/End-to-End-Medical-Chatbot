<body>
	<div class="container-fluid h-100">
		<div class="row justify-content-center h-100">
			<div class="col-md-8 col-xl-6 chat">
				<div class="card">

					<div class="card-header msg_head">
						<div class="d-flex bd-highlight">
							<div class="img_cont">
								<img
									src="https://cdn-icons-png.flaticon.com/512/387/387569.png"
									class="rounded-circle user_img"
									alt="Medical chatbot"
								>
								<span class="online_icon"></span>
							</div>

							<div class="user_info">
								<span>Medical Chatbot</span>
								<p>Ask me anything!</p>
							</div>
						</div>
					</div>

					<div
						id="messageFormeight"
						class="card-body msg_card_body"
					></div>

					<div class="card-footer">
						<form id="messageArea" class="input-group">
							<input
								type="text"
								id="text"
								name="msg"
								placeholder="Type your message..."
								autocomplete="off"
								class="form-control type_msg"
								required
							>

							<div class="input-group-append">
								<button
									type="submit"
									id="send"
									class="input-group-text send_btn"
									aria-label="Send message"
								>
									<i class="fas fa-location-arrow"></i>
								</button>
							</div>
						</form>
					</div>

				</div>
			</div>
		</div>
	</div>

	<script>
		$(document).ready(function () {
			const userImage =
				"https://i.ibb.co/d5b84Xw/Untitled-design.png";

			const botImage =
				"https://cdn-icons-png.flaticon.com/512/387/387569.png";

			function getCurrentTime() {
				const date = new Date();
				const hour = String(date.getHours()).padStart(2, "0");
				const minute = String(date.getMinutes()).padStart(2, "0");

				return hour + ":" + minute;
			}

			function escapeHtml(text) {
				return $("<div>").text(text).html();
			}

			function scrollToBottom() {
				const messageBox = $("#messageFormeight");

				messageBox.scrollTop(
					messageBox[0].scrollHeight
				);
			}

			$("#messageArea").on("submit", function (event) {
				event.preventDefault();

				const rawText = $("#text").val().trim();

				if (!rawText) {
					return;
				}

				const userTime = getCurrentTime();
				const safeUserText = escapeHtml(rawText);

				const userHtml = `
					<div class="d-flex justify-content-end mb-4">
						<div class="msg_cotainer_send">
							${safeUserText}
							<span class="msg_time_send">
								${userTime}
							</span>
						</div>

						<div class="img_cont_msg">
							<img
								src="${userImage}"
								class="rounded-circle user_img_msg"
								alt="User"
							>
						</div>
					</div>
				`;

				$("#text").val("");
				$("#messageFormeight").append(userHtml);
				scrollToBottom();

				$.ajax({
					data: {
						msg: rawText
					},
					type: "POST",
					url: "/get"
				})
				.done(function (data) {
					const botTime = getCurrentTime();

					const botHtml = `
						<div class="d-flex justify-content-start mb-4">
							<div class="img_cont_msg">
								<img
									src="${botImage}"
									class="rounded-circle user_img_msg"
									alt="Medical chatbot"
								>
							</div>

							<div class="msg_cotainer">
								${data}
								<span class="msg_time">
									${botTime}
								</span>
							</div>
						</div>
					`;

					$("#messageFormeight").append(botHtml);
					scrollToBottom();
				})
				.fail(function () {
					const errorTime = getCurrentTime();

					const errorHtml = `
						<div class="d-flex justify-content-start mb-4">
							<div class="img_cont_msg">
								<img
									src="${botImage}"
									class="rounded-circle user_img_msg"
									alt="Medical chatbot"
								>
							</div>

							<div class="msg_cotainer">
								Sorry, something went wrong.
								<span class="msg_time">
									${errorTime}
								</span>
							</div>
						</div>
					`;

					$("#messageFormeight").append(errorHtml);
					scrollToBottom();
				});
			});
		});
	</script>
</body>
